<!doctype html>
<html><head><meta charset="utf-8"><title>Summon Icons</title>
<style>
  body { margin:0; font:14px -apple-system, system-ui, sans-serif; background:#fff; color:#111; }
  section { padding:28px 32px; }
  .dark { background:#1c1c1e; color:#eee; }
  h2 { margin:0 0 16px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; opacity:.6; }
  .row { display:flex; align-items:flex-end; gap:28px; flex-wrap:wrap; }
  .row figure { margin:0; text-align:center; font-size:11px; opacity:.85; }
  .bar { height:24px; display:flex; align-items:center; justify-content:flex-end; gap:14px;
         padding:0 14px; border-radius:6px; font-size:13px; margin-top:20px; max-width:420px; }
  .bar.light { background:rgba(246,246,246,.95); color:#000; box-shadow:0 1px 0 #ccc; }
  .bar.dark  { background:rgba(40,40,42,.95); color:#fff; }
  .bar.dark img { filter: invert(1); }
  .bar .on { background:rgba(0,0,0,.12); border-radius:4px; padding:2px 4px; }
  .bar.dark .on { background:rgba(255,255,255,.18); }
</style></head><body>
<section>
  <h2>App icon · light</h2>
  <div class="row">
    <figure><img src="app-icon-light.svg" width="256"><figcaption>256</figcaption></figure>
    <figure><img src="app-icon-light.svg" width="128"><figcaption>128</figcaption></figure>
    <figure><img src="app-icon-light.svg" width="64"><figcaption>64</figcaption></figure>
    <figure><img src="app-icon-light.svg" width="32"><figcaption>32</figcaption></figure>
    <figure><img src="app-icon-light.svg" width="16"><figcaption>16</figcaption></figure>
  </div>
  <div class="bar light"><span class="on"><img src="menubar-template.svg" width="18" height="18" style="vertical-align:middle"></span><span>🔋</span><span>Wed 15 Oct 9:41</span></div>
</section>
<section class="dark">
  <h2>App icon · dark</h2>
  <div class="row">
    <figure><img src="app-icon-dark.svg" width="256"><figcaption>256</figcaption></figure>
    <figure><img src="app-icon-dark.svg" width="128"><figcaption>128</figcaption></figure>
    <figure><img src="app-icon-dark.svg" width="64"><figcaption>64</figcaption></figure>
    <figure><img src="app-icon-dark.svg" width="32"><figcaption>32</figcaption></figure>
    <figure><img src="app-icon-dark.svg" width="16"><figcaption>16</figcaption></figure>
  </div>
  <div class="bar dark"><span class="on"><img src="menubar-template.svg" width="18" height="18" style="vertical-align:middle"></span><span>🔋</span><span>Wed 15 Oct 9:41</span></div>
</section>
</body></html>
