# XcodeGen spec. Run `xcodegen` (or `make project`) to produce Summon.xcodeproj.
name: Summon
options:
  bundleIdPrefix: com.octoth0rpe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Summon:
    type: application
    platform: macOS
    sources:
      - Summon
    dependencies:
      - package: TOMLKit
    info:
      path: Summon/Info.plist
      properties:
        CFBundleName: Summon
        CFBundleDisplayName: Summon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 octoth0rpe
    entitlements:
      path: Summon/Summon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # App Folders: read folders the user picks, and remember them as bookmarks.
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octoth0rpe.summon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc signing so it builds without a developer account.
        # Set DEVELOPMENT_TEAM and remove this to sign for distribution.
        CODE_SIGN_IDENTITY: "-"
