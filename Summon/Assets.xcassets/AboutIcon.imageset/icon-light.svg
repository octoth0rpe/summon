    <path transform="translate(480 548) scale(250)" fill="url(#spark)" d="M0,-1 Q0.16,-0.16 1,0 Q0.16,0.16 0,1 Q-0.16,0.16 -1,0 Q-0.16,-0.16 0,-1Z"/>
    <path transform="translate(726 300) scale(80)" fill="#C084FC" d="M0,-1 Q0.16,-0.16 1,0 Q0.16,0.16 0,1 Q-0.16,0.16 -1,0 Q-0.16,-0.16 0,-1Z"/>
    <path transform="translate(300 300) scale(48)" fill="#A78BFA" d="M0,-1 Q0.16,-0.16 1,0 Q0.16,0.16 0,1 Q-0.16,0.16 -1,0 Q-0.16,-0.16 0,-1Z"/>
  </g>
</svg>
